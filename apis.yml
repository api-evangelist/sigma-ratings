name: Sigma360
description: >-
  Sigma360 (formerly Sigma Ratings) is a financial-crime-compliance platform for sanctions and
  watchlist screening, AML investigations, adverse-media screening, enhanced due diligence, perpetual
  KYC, third-party risk management, country risk ratings, and counterparty credit-risk monitoring. Its
  REST API (OpenAPI 3.1, v2.0.1) lets you screen entities against risk data, enroll them for continuous
  monitoring, retrieve risk profiles and change history, and subscribe to webhook events — authenticated
  with an API key over https://api.sigma360.com/external/v2.
